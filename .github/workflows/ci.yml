name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.14.0
      - run: ruff check livequill tests bin/livequill scripts/build-pyz.py
      - name: Shell scripts (shellcheck)
        run: shellcheck install.sh scripts/test-install.sh

  js:
    name: Browser code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Syntax check (overlay, setup, dashboard, showcase)
        run: node scripts/check-js.mjs
      - run: node --check scripts/record-demo.mjs
      - run: node --check tests/e2e/browser.mjs

  package:
    name: Package & smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build==1.3.0
          python -m build
      - name: Install the wheel and start the server
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/livequill --version
          mkdir -p /tmp/site && echo '<h1>hi</h1>' > /tmp/site/index.html
          /tmp/venv/bin/livequill /tmp/site --no-open --config /tmp/lq.json --port 8777 &
          for i in $(seq 30); do curl -fs http://127.0.0.1:8777/__setup >/dev/null && break; sleep 0.5; done
          curl -fs http://127.0.0.1:8777/__setup | grep -q 'lq-token'
          curl -fs http://127.0.0.1:8777/__lq/overlay.js >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8777/__setup)" = 403
      - name: Install with install.sh and start the server (single-file archive)
        run: scripts/test-install.sh --host

  install:
    name: install.sh on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", python: "apt-get update -qq && apt-get install -y -qq python3" }
          - { image: "ubuntu:24.04", python: "apt-get update -qq && apt-get install -y -qq python3 curl" }
          - { image: "debian:12", python: "apt-get update -qq && apt-get install -y -qq python3" }
          - { image: "fedora:latest", python: "dnf install -y -q python3" }
          - { image: "rockylinux:9", python: "dnf install -y -q python3.12" }
          - { image: "archlinux:latest", python: "pacman -Sy --noconfirm python" }
          - { image: "alpine:latest", python: "apk add -q python3" }
          - { image: "opensuse/tumbleweed", python: "zypper -n -q in python3" }
          - { image: "opensuse/leap:15.6", python: "zypper -n -q in python311" }
    steps:
      - uses: actions/checkout@v7
      - name: Install Python with the distro's package manager, then LiveQuill with install.sh
        run: scripts/test-install.sh "${{ matrix.image }}" "${{ matrix.python }}"
      - name: Without Python, the installer explains what to install
        if: matrix.image == 'debian:12'
        run: scripts/test-install.sh debian:12 --no-python 'apt install'

  e2e:
    name: Browser e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Edit → reload → undo in headless Chrome
        run: node tests/e2e/browser.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the whole git history with gitleaks
        env:
          VERSION: 8.24.3
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$VERSION
          file=gitleaks_${VERSION}_linux_x64.tar.gz
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/gitleaks_${VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar xzf "$file" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  # The single required check for branch protection: green only if every job above is green.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, lint, js, package, install, e2e, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "import json,sys; r={k:v['result'] for k,v in json.load(sys.stdin).items()}; print(r); sys.exit(any(v!='success' for v in r.values()))"
