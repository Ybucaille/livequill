name: Showcase site

on:
  push:
    branches: [main]
    paths: [site/**, docs/**, install.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site (page + demo video + screenshots + installer)
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp docs/demo.mp4 _site/assets/
          cp -r docs/images _site/assets/images
          cp install.sh _site/install.sh
          # cache busting: each deployment links its own files, so browsers never show an old demo
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
