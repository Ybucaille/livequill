[project]
name = "livequill"
version = "0.3.1"
description = "A floating prompt bar for any local website: any model (API, local or CLI agent) edits your files live."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
livequill = "livequill.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["livequill", "livequill.adapters"]

[tool.setuptools.package-data]
livequill = ["static/*", "static/i18n/*", "templates/*/*"]

[tool.ruff]
target-version = "py310"
line-length = 150

[tool.ruff.lint]
# Erreurs réelles (pyflakes, bugbear, syntaxe) ; le style compact du projet (one-liners) est voulu
select = ["F", "E9", "E7", "W6", "B"]
ignore = ["E701", "E702", "E731", "E741", "B008"]
