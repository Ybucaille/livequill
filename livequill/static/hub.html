<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="lq-token" content="__LQ_TOKEN__">
<title>LiveQuill · My sites</title>
<link rel="stylesheet" href="/__lq/theme.css">
<style>
  header.top .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:40px 0 22px}
  .head h1{margin:0;font-size:clamp(30px,4.4vw,42px);letter-spacing:-.025em;line-height:1.1}
  .head p{margin:6px 0 0;color:var(--soft);max-width:560px}
  .head .sp{flex:1}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;color:var(--soft);cursor:pointer;font-family:inherit}
  .chip b{color:var(--ink);font-weight:600}
  .chip:hover{background:var(--glass-2)}

  /* --- Cartes des sites --- */
  .sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
  .scard{display:flex;flex-direction:column;border-radius:24px;overflow:hidden;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:var(--shadow);transition:transform .2s}
  .scard:hover{transform:translateY(-3px)}
  /* coins arrondis du cadre : clip-path, car overflow:hidden ne rogne pas l'aperçu mis à l'échelle sous Firefox */
  .scard .shot{border-bottom:1px solid var(--line2);cursor:pointer;border-radius:24px 24px 0 0;clip-path:inset(0 round 23px 23px 0 0);isolation:isolate}
  .ph{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 30%,transparent),color-mix(in srgb,var(--cloudc) 30%,transparent))}
  .ph span{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:var(--glass-2);font-size:28px;font-weight:700;color:var(--ink)}
  .ph small{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:var(--soft);font-size:12.5px}
  .sbody{display:flex;flex-direction:column;gap:4px;padding:14px 16px 16px}
  .kh{display:flex;align-items:center;gap:6px;min-height:34px}
  .kh b{flex:1;font-size:16.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kh .rename{flex:1;padding:4px 9px;font-size:16px;font-weight:650;border-radius:10px}
  .more{flex:none;display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:10px;background:none;color:var(--mute);cursor:pointer}
  .more:hover,.more[aria-expanded=true]{background:var(--line2);color:var(--ink)}
  .more svg{width:18px;height:18px}
  .path{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
  .state{font-size:13px;font-weight:600;color:var(--mute)}
  .st-ok .state{color:var(--ok)}.st-busy .state{color:var(--warn)}.st-bad .state{color:var(--bad)}
  .srow{display:flex;align-items:center;gap:8px;min-height:28px}
  .srow .state{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stop{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border:1px solid var(--line2);border-radius:999px;background:none;color:var(--soft);
    font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .stop i{width:8px;height:8px;border-radius:2px;background:currentColor}
  .stop:hover{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
  .scard .open{width:100%;margin-top:10px}
  .newcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:290px;border-radius:24px;border:2px dashed var(--line);
    background:color-mix(in srgb,var(--glass) 55%,transparent);color:var(--soft);cursor:pointer;font:inherit;text-align:center;padding:20px;transition:border-color .2s,background .2s}
  .newcard:hover{border-color:var(--acc);background:var(--glass)}
  .newcard .ico{width:54px;height:54px;border-radius:18px}
  .newcard b{color:var(--ink);font-size:16.5px}
  .newcard small{max-width:220px;font-size:13.5px}
  .welcome{max-width:720px;margin:30px auto 0}
  .welcome .island{text-align:center;padding:34px 30px 30px}
  .welcome h2{margin:16px 0 8px;font-size:28px;letter-spacing:-.02em}
  .welcome p{margin:0 auto 22px;color:var(--soft);max-width:520px}
  .welcome .ico{margin:0 auto;width:60px;height:60px;border-radius:20px}
  .welcome .ico svg{width:30px;height:30px}

  /* --- Assistant de création --- */
  .wz-top{display:flex;gap:6px;margin:6px 46px 16px 0}   /* place laissée au bouton fermer */
  .wz-top i{height:5px;flex:1;border-radius:9px;background:var(--line2)}
  .wz-top i.on{background:var(--acc)}
  .wz-body{margin-top:18px;min-height:250px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .choice{position:relative;display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:20px;border-radius:22px;background:var(--card);border:2px solid var(--line2);
    color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:transform .18s,border-color .18s,background .18s}
  .choice:hover:not(:disabled){transform:translateY(-2px);background:var(--card-h)}
  .choice.sel{border-color:var(--acc);background:var(--card-h)}
  .choice:disabled{cursor:not-allowed;opacity:.55}
  .choice b{font-size:17px}
  .choice small{color:var(--soft);font-size:14px;line-height:1.45}
  .choice .badge{position:absolute;top:16px;right:16px}
  .choice .tick{position:absolute;top:14px;right:14px;z-index:2;display:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;place-items:center}
  .choice.sel .tick{display:grid}
  .choice .tick svg{width:15px;height:15px}
  .choice .shot{width:100%;border-radius:14px;border:1px solid var(--line2);margin-bottom:4px}
  .details{display:grid;grid-template-columns:1fr 1.1fr;gap:22px;align-items:start}
  .details .shot{border-radius:16px;border:1px solid var(--line2)}
  .where{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;background:var(--line2)}
  .where svg{width:18px;height:18px;flex:none;color:var(--mute)}
  .where span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
  .help{margin:6px 0 0;font-size:13px;color:var(--mute)}
  .wz-foot{display:flex;gap:10px;align-items:center;margin-top:22px}
  .wz-foot .sp{flex:1}
  .done{text-align:center}
  .done .ok{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 10px;border-radius:50%;background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
  .done .ok svg{width:30px;height:30px}
  .done .shot{max-width:520px;margin:16px auto;border-radius:16px;border:1px solid var(--line2)}
  .tips{max-width:520px;margin:0 auto;text-align:left;font-size:14px;color:var(--soft)}
  .tips ul{margin:6px 0 0;padding-left:20px}
  @media (max-width:760px){.choices,.details{grid-template-columns:1fr}.details .shot{display:none}}
  @media (prefers-reduced-motion: reduce){.scard,.choice,.newcard{transition:none}}
</style>
</head>
<body>
<main>
  <header class="top">
    <a class="brand" id="brand" href="/"></a>
    <div class="acts">
      <a class="pill-link" id="back" hidden></a>
      <div id="lang"></div>
      <button type="button" class="pill icon" id="gear"></button>
      <button type="button" class="go" id="new"></button>
    </div>
  </header>

  <section class="head">
    <div><h1 data-t>My sites</h1><p data-t>Open a site to edit it with the prompt bar. Every change becomes a version you can preview and go back to.</p></div>
    <span class="sp"></span>
    <button type="button" class="chip" id="model" hidden></button>
  </section>
  <div id="list"></div>
</main>

<!-- Assistant : nouveau site ou site existant -->
<div class="overlay" id="wizard">
  <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="wz-title">
    <button type="button" class="x" data-close></button>
    <div class="wz-top" id="wz-top"></div>
    <h3 id="wz-title"></h3><p class="lead" id="wz-lead"></p>
    <div class="wz-body" id="wz-body"></div>
    <div class="msg bad" id="wz-msg" role="status"></div>
    <div class="wz-foot" id="wz-foot"></div>
  </div>
</div>

<!-- Modifier un site -->
<div class="overlay" id="edit">
  <form class="modal" role="dialog" aria-modal="true" aria-labelledby="ed-title" autocomplete="off">
    <button type="button" class="x" data-close></button>
    <h3 id="ed-title"></h3>
    <label for="ed-name" data-t>Site name</label>
    <input type="text" id="ed-name" required>
    <label data-t>Folder</label>
    <div class="where"><span id="ed-root"></span><button type="button" class="b sm" id="ed-change" data-t>Change…</button></div>
    <details id="ed-adv"><summary data-t>Advanced</summary>
      <div class="check"><input type="checkbox" id="ed-proxy-on"><label for="ed-proxy-on" data-t>Serve it behind my dev server (Vite, Next, Astro…)</label></div>
      <div id="ed-proxy-row"><label for="ed-proxy" data-t>Dev server address</label><input type="url" id="ed-proxy" placeholder="http://localhost:5173" spellcheck="false"></div>
    </details>
    <div class="row">
      <button type="submit" class="b pri" data-t>Save</button>
      <button type="button" class="b" data-close data-t>Close</button>
      <span class="msg" id="ed-msg" role="status"></span>
      <span class="sp"></span>
      <button type="button" class="b danger" id="ed-remove" data-t>Remove from the list</button>
    </div>
  </form>
</div>

<script src="/__lq/ui.js"></script>
<script src="/__lq/providers.js"></script>
<script src="/__lq/settings.js"></script>
<script src="/__lq/sky.js"></script>
<script>
(() => {
  const { t, esc, $, api, icon, logo, openModal, closeModal, langMenu, fit, pickFolder } = LQ;
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = t(el.textContent.trim());
  for (const x of document.querySelectorAll('.x')) { x.textContent = '×'; x.setAttribute('aria-label', t('Close')); }
  document.title = 'LiveQuill · ' + t('My sites');
  $('#brand').innerHTML = logo + 'LiveQuill';
  $('#gear').innerHTML = icon('gear'); $('#gear').title = t('Settings'); $('#gear').setAttribute('aria-label', t('Settings'));
  $('#new').innerHTML = icon('plus') + esc(t('New site'));
  langMenu($('#lang'));
  document.addEventListener('click', e => { const c = e.target.closest('[data-close]'); if (c) closeModal(c.closest('.overlay')); });

  // Venu d'un site (bouton réglages de la barre) : lien de retour vers ce site
  const back = new URLSearchParams(location.search).get('back');
  if (back && /^http:\/\/127\.0\.0\.1:\d+\//.test(back)) { $('#back').hidden = false; $('#back').href = back; $('#back').innerHTML = icon('back') + esc(t('Back to the site')); }

  let sites = [], sig = '', info = null, settings = null;
  const shotHtml = (src, label) => `<div class="shot">${src ? `<iframe src="${esc(src)}" sandbox="allow-same-origin" scrolling="no" tabindex="-1" title="${esc(label)}"></iframe>` : ''}</div>`;
  const fitAll = root => root.querySelectorAll('.shot').forEach(fit);

  /* --- Liste des sites --- */
  async function refresh(force) {
    info = await api('sites');
    sites = info.sites;
    const d = info.default;
    $('#model').hidden = !d;
    if (d) $('#model').innerHTML = `${icon('sparkle').replace('<svg', '<svg width="15" height="15"')} ${esc(t('Default model'))}: <b>${esc(d.model)}</b> · ${esc(info.providers[d.provider] || d.provider)}`;
    const s = JSON.stringify(sites.map(x => [x.id, x.name, x.display, x.running, x.busy, x.exists, x.thumb, x.proxy, x.url]));
    if ((force || s !== sig) && !menu && !renaming) { sig = s; render(); }   // pas de rendu sous un menu ouvert ou un nom en cours d'édition
  }

  function card(s) {
    const st = !s.exists ? 'bad' : s.busy ? 'busy' : s.running ? 'ok' : '';
    const label = !s.exists ? t('Folder not found') : s.busy ? t('The model is working…') : s.running ? t('Running · {url}', { url: s.url.replace('http://', '').replace(/\/$/, '') }) : t('Stopped');
    const shot = s.thumb ? shotHtml(s.thumb + '?v=' + Date.now(), t('Preview of {name}', { name: s.name }))
      : `<div class="shot"><div class="ph"><span>${esc((s.name || '?').trim().charAt(0).toUpperCase())}</span><small>${esc(s.proxy ? t('Behind {url}', { url: s.proxy }) : !s.exists ? t('Folder not found') : t('No home page yet'))}</small></div></div>`;
    return `<article class="scard st-${st}" data-id="${esc(s.id)}">
      <div data-open="${esc(s.id)}" title="${esc(t('Open'))}">${shot}</div>
      <div class="sbody">
        <div class="kh"><b title="${esc(s.name)}">${esc(s.name)}</b>
          <button type="button" class="more" data-menu="${esc(s.id)}" aria-haspopup="menu" aria-expanded="false" title="${esc(t('More actions (or right-click the card)'))}" aria-label="${esc(t('More actions'))}">${icon('more')}</button></div>
        <div class="path" title="${esc(s.root)}"><bdi>${esc(s.display)}</bdi></div>
        <div class="srow"><span class="dot" aria-hidden="true"></span><span class="state">${esc(label)}</span>
          ${s.running ? `<button type="button" class="stop" data-stop="${esc(s.id)}"><i aria-hidden="true"></i>${esc(t('Stop'))}</button>` : ''}</div>
        <button type="button" class="b pri open" data-open="${esc(s.id)}" ${s.exists ? '' : 'disabled'}>${esc(t('Open'))}</button>
      </div></article>`;
  }

  function render() {
    if (!sites.length) {
      $('#list').innerHTML = `<div class="welcome isle"><div class="cushion" aria-hidden="true"><i></i><i></i><i></i></div><div class="island">
        <div class="ico">${icon('sparkle')}</div>
        <h2>${esc(t('Let’s create your first site'))}</h2>
        <p>${esc(t('Start from a ready-made template or a blank page, or add a site that is already on this computer. Then describe the changes you want, in plain words.'))}</p>
        <div class="row" style="justify-content:center"><button type="button" class="go" data-wizard="create">${icon('plus')}${esc(t('Create a new site'))}</button>
        <button type="button" class="b" data-wizard="existing">${icon('folder')}${esc(t('Add an existing site'))}</button></div></div></div>`;
      return;
    }
    $('#list').innerHTML = `<div class="sites">${sites.map(card).join('')}
      <button type="button" class="newcard" data-wizard="start"><span class="ico">${icon('plus')}</span><b>${esc(t('New site'))}</b><small>${esc(t('Start from a template, or add a folder you already have.'))}</small></button></div>`;
    fitAll($('#list'));
  }

  $('#list').addEventListener('click', async e => {
    const b = e.target.closest('[data-open],[data-menu],[data-stop],[data-wizard]'); if (!b || b.disabled || renaming) return;
    if (b.dataset.wizard) return wizard(b.dataset.wizard);
    if (b.dataset.menu) { const r = b.getBoundingClientRect(); return showMenu(b.dataset.menu, r.right, r.bottom + 6, b); }
    if (b.dataset.stop) return act('stop', b.dataset.stop);
    if (b.dataset.open) return openSite(b.dataset.open);
  });
  // Clic droit (ou touche Menu) sur une carte : toutes les actions du site
  $('#list').addEventListener('contextmenu', e => {
    const c = e.target.closest('.scard'); if (!c || e.target.closest('input')) return;
    e.preventDefault();
    const r = c.getBoundingClientRect();
    showMenu(c.dataset.id, e.clientX || r.left + 24, e.clientY || r.top + 24);
  });

  /* --- Menu contextuel d'un site --- */
  let menu = null, renaming = false;
  function closeMenu() {
    if (!menu) return;
    if (menu.anchor) menu.anchor.setAttribute('aria-expanded', 'false');
    const el = menu.el; menu = null;
    el.classList.add('closing'); setTimeout(() => el.remove(), 120);
  }
  function showMenu(id, x, y, anchor) {
    const s = sites.find(v => v.id === id); if (!s) return;
    closeMenu();
    const items = [['open', 'ext', t('Open'), s.exists], ['rename', 'edit', t('Rename'), true], ['reveal', 'open', t('Show the folder'), s.exists],
      ['edit', 'gear', t('Site settings…'), true]].concat(s.running ? [['stop', 'stop', t('Stop'), true]] : []);
    const el = document.createElement('div');
    el.className = 'ctx'; el.setAttribute('role', 'menu');
    el.innerHTML = items.map(([k, ic, label, ok]) => `<button type="button" role="menuitem" data-act="${k}" ${ok ? '' : 'disabled'}>${icon(ic)}${esc(label)}</button>`).join('')
      + `<hr><button type="button" role="menuitem" class="danger" data-act="remove">${icon('trash')}${esc(t('Remove from the list'))}</button>`;
    document.body.appendChild(el);
    const w = el.offsetWidth, h = el.offsetHeight;
    el.style.left = Math.max(8, Math.min(anchor ? x - w : x, innerWidth - w - 8)) + 'px';
    el.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px';
    if (anchor) anchor.setAttribute('aria-expanded', 'true');
    menu = { el, id, anchor };
    el.querySelector('button:not(:disabled)').focus();
    el.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) { closeMenu(); act(b.dataset.act, id); } });
    el.addEventListener('keydown', e => {
      const bs = [...el.querySelectorAll('button:not(:disabled)')], i = bs.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); bs[(i + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length].focus(); }
      if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); const a = menu && menu.anchor; closeMenu(); if (a) a.focus(); }
    });
  }
  document.addEventListener('mousedown', e => { if (menu && !menu.el.contains(e.target) && e.target !== menu.anchor) closeMenu(); });
  addEventListener('resize', closeMenu); addEventListener('scroll', closeMenu, true);

  async function act(what, id) {
    const s = sites.find(v => v.id === id); if (!s) return;
    try {
      if (what === 'open') return openSite(id);
      if (what === 'rename') return rename(s);
      if (what === 'reveal') return await api('sites/reveal', { id });
      if (what === 'edit') return editSite(s);
      if (what === 'stop') { await api('sites/stop', { id }); return refresh(true); }
      if (what === 'remove' && await LQ.confirm({ title: t('Remove “{name}” from the list?', { name: s.name }),
        text: t('The folder and its files are not deleted. You can add the site again at any time.'), ok: t('Remove'), danger: true })) {
        await api('sites/delete', { id }); refresh(true);
      }
    } catch (err) { alert(t(err.message)); }
  }

  // Renommer sur place : Entrée ou clic ailleurs enregistre, Échap annule
  function rename(s) {
    const b = $(`.scard[data-id="${CSS.escape(s.id)}"] .kh b`); if (!b) return;
    const input = document.createElement('input');
    input.type = 'text'; input.className = 'rename'; input.value = s.name; input.maxLength = 80; input.setAttribute('aria-label', t('Site name'));
    b.replaceWith(input); renaming = true; input.focus(); input.select();
    const done = async keep => {
      if (!renaming) return;
      renaming = false;
      const name = input.value.trim();
      if (keep && name && name !== s.name) await api('sites/save', { id: s.id, root: s.root, name, proxy: s.proxy }).catch(err => alert(t(err.message)));
      refresh(true);
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); done(true); } if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); } });
    input.addEventListener('blur', () => done(true));
  }

  async function openSite(id) {
    const w = window.open('about:blank', '_blank');     // ouvert tout de suite : pas bloqué comme fenêtre surgissante
    try {
      const r = await api('sites/start', { id });
      if (w) w.location.href = r.url; else location.href = r.url;
    } catch (err) { if (w) w.close(); alert(t(err.message)); }
    refresh();
  }

  /* --- Assistant : chaque écran a un titre, une explication et une seule décision --- */
  const W = { el: $('#wizard') };
  const step = (n, total) => $('#wz-top').innerHTML = Array.from({ length: total }, (_, i) => `<i class="${i <= n ? 'on' : ''}"></i>`).join('');
  const foot = (backTo, nextLabel, nextOk = true) => {
    $('#wz-foot').innerHTML = `${backTo ? `<button type="button" class="b ghost" data-back>${icon('back')}${esc(t('Back'))}</button>` : ''}<span class="sp"></span>
      ${nextLabel ? `<button type="button" class="b pri" data-next ${nextOk ? '' : 'disabled'}>${esc(nextLabel)}${icon('next')}</button>` : ''}`;
    W.back = backTo;
  };
  const screen = (title, lead, body) => { $('#wz-title').textContent = title; $('#wz-lead').textContent = lead; $('#wz-body').innerHTML = body; $('#wz-msg').textContent = ''; };
  const choice = (key, ico, title, text, opts = {}) => `<button type="button" class="choice ${opts.sel ? 'sel' : ''}" data-choice="${key}" ${opts.disabled ? 'disabled' : ''}>
      ${opts.badge ? `<span class="badge">${esc(opts.badge)}</span>` : '<span class="tick">' + icon('check') + '</span>'}
      ${opts.shot || `<span class="ico">${icon(ico)}</span>`}<b>${esc(title)}</b><small>${esc(text)}</small></button>`;

  function wizard(start) {
    Object.assign(W, { kind: 'static', template: 'blank', name: '', root: null, parent: null, fixedRoot: null, proxy: '' });
    if (!W.el.classList.contains('open')) openModal(W.el);
    if (start === 'create') return showKind();
    if (start === 'existing') return chooseExisting();
    showStart();
  }

  function showStart() {
    step(0, 4); foot(null, null);
    screen(t('New site'), t('What would you like to do?'), `<div class="choices">
      ${choice('create', 'sparkle', t('Create a new site'), t('LiveQuill prepares the files for you, from a template or a blank page. Nothing to install.'))}
      ${choice('existing', 'folder', t('Add an existing site'), t('A folder on this computer that already contains a website.'))}</div>`);
    W.pick = k => k === 'create' ? showKind() : chooseExisting();
  }

  function showKind() {
    step(1, 4); foot('start', t('Continue'));
    screen(t('What kind of site?'), t('Static sites are made of pages (HTML, CSS, JavaScript): perfect for a company website, a portfolio or an event page.'), `<div class="choices">
      ${choice('static', 'site', t('Static site'), t('Pages served as they are. Fast, simple, and easy to host anywhere.'), { sel: W.kind === 'static' })}
      ${choice('dynamic', 'server', t('Dynamic site'), t('With a server and a demo database, for pages built from data.'), { disabled: true, badge: t('Later') })}</div>`);
    W.pick = k => { if (k === 'static') { W.kind = k; showTemplate(); } };
    W.next = showTemplate;
  }

  async function showTemplate() {
    step(2, 4); foot(W.fixedRoot ? 'existing-confirm' : 'kind', t('Continue'));
    const { templates } = await api('templates');
    screen(t('Choose a starting point'), t('You can change everything afterwards by asking in the bar. More templates will come.'),
      `<div class="choices">${templates.map(tp => choice(tp.id, 'site', t(tp.name), t(tp.description),
        { sel: W.template === tp.id, shot: shotHtml(`/__lq/template/${encodeURIComponent(tp.id)}/?name=${encodeURIComponent(W.name || t('Your company'))}`, t(tp.name)) })).join('')}</div>`);
    fitAll($('#wz-body'));
    W.pick = k => { W.template = k; $('#wz-body').querySelectorAll('.choice').forEach(c => c.classList.toggle('sel', c.dataset.choice === k)); };
    W.next = showDetails;
  }

  let suggestTimer = null;
  async function suggest() {
    if (W.fixedRoot) { W.root = W.fixedRoot; $('#wz-where').textContent = W.fixedRoot; $('#wz-where-help').textContent = t('The site will be created in this folder.'); return; }
    const q = new URLSearchParams({ name: W.name || t('My site') });
    if (W.parent) q.set('parent', W.parent);
    try {
      const r = await api('sites/suggest?' + q);
      W.root = r.root;
      $('#wz-where').textContent = r.display; $('#wz-where').title = r.root;
      $('#wz-where-help').textContent = t('A new folder will be created in {parent}.', { parent: r.parent_display });
    } catch (e) { $('#wz-msg').textContent = t(e.message); }
  }

  function showDetails() {
    step(3, 4); foot('template', t('Create the site'), !!W.name.trim());
    screen(t('Name your site'), t('This name appears on the site. You can change it later.'), `<div class="details"><div>
        <label for="wz-name">${esc(t('Site name'))}</label>
        <input type="text" id="wz-name" value="${esc(W.name)}" placeholder="${esc(t('e.g. Acme Bakery'))}" maxlength="80" autofocus>
        <label>${esc(t('Where to save it'))}</label>
        <div class="where">${icon('folder')}<span id="wz-where"></span>${W.fixedRoot ? '' : `<button type="button" class="b sm" id="wz-change">${esc(t('Change…'))}</button>`}</div>
        <p class="help" id="wz-where-help"></p></div>
      ${shotHtml(`/__lq/template/${encodeURIComponent(W.template)}/?name=${encodeURIComponent(W.name || t('Your company'))}`, t('Preview'))}</div>`);
    fitAll($('#wz-body'));
    const input = $('#wz-name');
    input.focus();
    input.addEventListener('input', () => {
      W.name = input.value;
      $('#wz-foot [data-next]').disabled = !W.name.trim();
      clearTimeout(suggestTimer);
      suggestTimer = setTimeout(() => {
        suggest();
        const f = $('#wz-body .shot iframe');
        if (f) f.src = `/__lq/template/${encodeURIComponent(W.template)}/?name=${encodeURIComponent(W.name || t('Your company'))}`;
      }, 300);
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && W.name.trim()) { e.preventDefault(); create(); } });
    if ($('#wz-change')) $('#wz-change').addEventListener('click', async () => {
      const r = await pickFolder({ title: t('Where should the site be saved?'), lead: t('Open the folder that will contain your site, then choose it.'),
        start: W.parent || (settings && settings.sites_dir) || '~', choose: t('Save it here'), want: 'parent' });
      if (r) { W.parent = r.path; suggest(); }
    });
    suggest();
    W.next = create;
  }

  async function create() {
    if (!W.name.trim()) return;
    const btn = $('#wz-foot [data-next]'); if (btn) { btn.disabled = true; btn.textContent = t('Creating…'); }
    try {
      const r = await api('sites/create', { name: W.name.trim(), template: W.template, root: W.root });
      await refresh(true);
      showDone(r.site, true);
    } catch (e) { $('#wz-msg').textContent = '✗ ' + t(e.message); if (btn) { btn.disabled = false; btn.innerHTML = esc(t('Create the site')) + icon('next'); } }
  }

  function showDone(site, created) {
    step(4, 4); foot(null, null);
    const s = sites.find(x => x.id === site.id) || site;
    screen('', '', `<div class="done"><div class="ok">${icon('check')}</div>
      <h3 style="margin:0 0 6px">${esc(created ? t('Your site is ready') : t('Your site was added'))}</h3>
      <p class="lead" style="margin:0 auto">${esc(t('Open it, then type the changes you want in the bar at the bottom of the page.'))}</p>
      ${s.thumb ? shotHtml(s.thumb + '?v=' + Date.now(), s.name) : ''}
      <div class="tips">${esc(t('For example:'))}<ul><li>${esc(t('“Put our logo at the top left and use our green as the main color”'))}</li>
        <li>${esc(t('“Add a team section with three people”'))}</li><li>${esc(t('“Write the about section from this text: …”'))}</li></ul></div>
      <div class="row" style="justify-content:center"><button type="button" class="go" data-done="open">${icon('ext')}${esc(t('Open the site'))}</button>
        <button type="button" class="b" data-done="reveal">${icon('open')}${esc(t('Show the folder'))}</button>
        <button type="button" class="b ghost" data-close>${esc(t('Back to my sites'))}</button></div></div>`);
    fitAll($('#wz-body'));
    $('#wz-title').hidden = true; $('#wz-lead').hidden = true;
    W.done = site.id;
  }

  async function chooseExisting() {
    const r = await pickFolder({ title: t('Where is your site?'), lead: t('Open the folder that contains your site (usually the one with an index.html file), then choose it. Folders that contain a website are marked.'),
      start: W.root || '~', choose: t('Choose this folder') });
    if (!r) { if (!W.root) showStart(); return; }
    W.root = r.path; W.found = r;
    W.name = W.name || r.path.split('/').pop();
    showExistingConfirm();
  }

  function showExistingConfirm() {
    const r = W.found, here = r.here;
    step(2, 4); foot('start', t('Add the site'));
    let note;
    if (here.html) note = `<div class="note">✓ <b>${esc(t('A website was found in this folder.'))}</b> ${esc(t('LiveQuill will serve it as it is and add the prompt bar, without writing anything to your files.'))}</div>`;
    else if (here.empty) note = `<div class="note"><b>${esc(t('This folder is empty.'))}</b> ${esc(t('Create a site in it from a template, so you have something to start from.'))}
        <div class="row"><button type="button" class="b pri sm" data-here-create>${icon('sparkle')}${esc(t('Create a site in this folder'))}</button></div></div>`;
    else if (here.node) note = `<div class="note"><b>${esc(t('This looks like a JavaScript project.'))}</b> ${esc(t('If it runs with a dev server (Vite, Next, Astro…), start it and enter its address under Advanced.'))}</div>`;
    else note = `<div class="note"><b>${esc(t('No home page (index.html) in this folder.'))}</b> ${esc(t('You can still add it: ask for a home page in the bar once the site is open.'))}</div>`;
    screen(t('Add an existing site'), t('Check the folder and give the site a name.'), `
      <label>${esc(t('Folder'))}</label>
      <div class="where">${icon('folder')}<span title="${esc(r.path)}">${esc(r.display)}</span><button type="button" class="b sm" id="wz-refolder">${esc(t('Change…'))}</button></div>
      <div style="margin-top:12px">${note}</div>
      <label for="wz-name">${esc(t('Site name'))}</label>
      <input type="text" id="wz-name" value="${esc(W.name)}" maxlength="80">
      <details ${here.node && !here.html ? 'open' : ''}><summary>${esc(t('Advanced'))}</summary>
        <div class="check"><input type="checkbox" id="wz-proxy-on" ${here.node && !here.html ? 'checked' : ''}><label for="wz-proxy-on">${esc(t('Serve it behind my dev server (Vite, Next, Astro…)'))}</label></div>
        <label for="wz-proxy">${esc(t('Dev server address'))}</label><input type="url" id="wz-proxy" placeholder="http://localhost:5173" value="${here.node && !here.html ? 'http://localhost:5173' : ''}" spellcheck="false">
      </details>`);
    $('#wz-name').addEventListener('input', e => { W.name = e.target.value; });
    $('#wz-refolder').addEventListener('click', chooseExisting);
    const hc = $('[data-here-create]'); if (hc) hc.addEventListener('click', () => { W.fixedRoot = W.root; showTemplate(); });
    W.next = addExisting;
  }

  async function addExisting() {
    const proxy = $('#wz-proxy-on').checked ? $('#wz-proxy').value.trim() : '';
    try {
      const r = await api('sites/save', { root: W.root, name: ($('#wz-name').value || '').trim(), proxy });
      await refresh(true);
      showDone(r.site, false);
    } catch (e) { $('#wz-msg').textContent = '✗ ' + t(e.message); }
  }

  W.el.addEventListener('click', async e => {
    const c = e.target.closest('[data-choice]');
    if (c && !c.disabled) return W.pick(c.dataset.choice);
    if (e.target.closest('[data-back]')) {
      $('#wz-title').hidden = false; $('#wz-lead').hidden = false;
      return ({ start: showStart, kind: showKind, template: showTemplate, 'existing-confirm': showExistingConfirm })[W.back]();
    }
    if (e.target.closest('[data-next]')) return W.next();
    const d = e.target.closest('[data-done]');
    if (d && d.dataset.done === 'open') { closeModal(W.el); return openSite(W.done); }
    if (d && d.dataset.done === 'reveal') return api('sites/reveal', { id: W.done }).catch(err => alert(t(err.message)));
  });
  const resetWizardHead = () => { $('#wz-title').hidden = false; $('#wz-lead').hidden = false; };
  $('#new').addEventListener('click', () => { resetWizardHead(); wizard('start'); });

  /* --- Modifier un site --- */
  const E = { el: $('#edit') };
  function editSite(s) {
    E.site = s; E.root = s.root;
    $('#ed-title').textContent = t('Site settings · {name}', { name: s.name });
    $('#ed-name').value = s.name;
    $('#ed-root').textContent = s.display; $('#ed-root').title = s.root;
    $('#ed-proxy-on').checked = !!s.proxy; $('#ed-proxy').value = s.proxy || '';
    $('#ed-adv').open = !!s.proxy;
    $('#ed-msg').textContent = '';
    openModal(E.el);
  }
  $('#ed-change').addEventListener('click', async () => {
    const r = await pickFolder({ title: t('Choose the site folder'), start: E.root });
    if (r) { E.root = r.path; $('#ed-root').textContent = r.display; $('#ed-root').title = r.path; }
  });
  $('form', E.el).addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await api('sites/save', { id: E.site.id, root: E.root, name: $('#ed-name').value.trim(), proxy: $('#ed-proxy-on').checked ? $('#ed-proxy').value.trim() : '' });
      closeModal(E.el); refresh(true);
    } catch (err) { $('#ed-msg').className = 'msg bad'; $('#ed-msg').textContent = '✗ ' + t(err.message); }
  });
  $('#ed-remove').addEventListener('click', () => { closeModal(E.el); act('remove', E.site.id); });

  /* --- Réglages : panneau commun (settings.js) --- */
  const openSettings = tab => LQ.settings.open({ tab, onChange: () => refresh(), onClose: () => {
    if (location.hash === '#settings') history.replaceState(null, '', location.pathname + location.search);
    api('settings').then(x => { settings = x; }).catch(() => {});
    refresh();
  } });
  $('#gear').addEventListener('click', () => openSettings());
  $('#model').addEventListener('click', () => openSettings('general'));

  api('settings').then(s => { settings = s; }).catch(() => {});
  refresh(true).catch(e => { $('#list').textContent = e.message; });
  if (location.hash === '#settings') openSettings();
  if (location.hash === '#new') wizard('start');
  setInterval(() => { if (!document.hidden) refresh().catch(() => {}); }, 4000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true).catch(() => {}); });   // vignettes à jour au retour sur la page
})();
</script>
</body>
</html>
